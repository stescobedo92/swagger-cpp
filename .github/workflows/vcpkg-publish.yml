name: vcpkg-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-registry:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed." }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

      - name: Generate portable registry
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          .\scripts\update-vcpkg-registry.ps1 -SourceRepository $env:SOURCE_REPOSITORY

      - name: Validate registry library consumer
        shell: pwsh
        run: |
          .\scripts\test-vcpkg-registry.ps1 -RegistryDirectory build/vcpkg-registry -VcpkgRoot "$env:RUNNER_TEMP/vcpkg" -ConsumerDirectory build/registry-library

      - name: Validate registry CLI consumer
        shell: pwsh
        run: |
          .\scripts\test-vcpkg-registry.ps1 -RegistryDirectory build/vcpkg-registry -VcpkgRoot "$env:RUNNER_TEMP/vcpkg" -Tools -ConsumerDirectory build/registry-tools

      - name: Pack registry bundle
        shell: pwsh
        run: |
          $version = (Get-Content packaging/vcpkg/ports/swaggercpp/vcpkg.json | ConvertFrom-Json).version
          Compress-Archive -Path .\build\vcpkg-registry\* -DestinationPath "swaggercpp-vcpkg-registry-v$version.zip" -Force

      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: swaggercpp-vcpkg-registry
          path: swaggercpp-vcpkg-registry-v*.zip

      - name: Attach registry bundle to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: swaggercpp-vcpkg-registry-v*.zip
